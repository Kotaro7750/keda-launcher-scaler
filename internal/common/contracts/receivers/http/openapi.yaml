openapi: 3.0.3
info:
  title: keda-launcher-scaler HTTP receiver API
  version: 0.1.0
paths:
  /requests:
    post:
      operationId: postRequests
      summary: Accept a time-bounded launch request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchRequest'
      responses:
        '202':
          description: The launch request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedRequest'
        '400':
          description: The request body does not match the HTTP API schema or domain rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The target ScaledObject is not known to this receiver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: The client request was canceled before the request could be accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /scaledobjects:
    get:
      operationId: listScaledObjects
      summary: List ScaledObjects known to this receiver.
      responses:
        '200':
          description: ScaledObjects currently available for request operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaledObjectList'
  /scaledobjects/{namespace}/{name}/requests/{requestId}:
    delete:
      operationId: deleteScaledObjectRequest
      summary: Delete a request window for a known ScaledObject.
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The request window was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedRequest'
        '404':
          description: The target ScaledObject or request ID is not known to this receiver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LaunchRequest:
      type: object
      required:
        - requestId
        - scaledObject
      properties:
        requestId:
          type: string
          minLength: 1
        scaledObject:
          $ref: '#/components/schemas/ScaledObject'
        startAt:
          type: string
          format: date-time
        duration:
          type: string
          minLength: 1
        endAt:
          type: string
          format: date-time
      oneOf:
        - required:
            - duration
        - required:
            - endAt
      additionalProperties: false
    ScaledObject:
      type: object
      required:
        - namespace
        - name
      properties:
        namespace:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      additionalProperties: false
    ScaledObjectList:
      type: object
      required:
        - scaledObjects
      properties:
        scaledObjects:
          type: array
          items:
            $ref: '#/components/schemas/ScaledObject'
      additionalProperties: false
    DeletedRequest:
      type: object
      required:
        - requestId
        - scaledObject
        - effectiveStart
        - effectiveEnd
      properties:
        requestId:
          type: string
        scaledObject:
          $ref: '#/components/schemas/ScaledObject'
        effectiveStart:
          type: string
          format: date-time
        effectiveEnd:
          type: string
          format: date-time
      additionalProperties: false
    AcceptedRequest:
      type: object
      required:
        - requestId
        - scaledObject
        - effectiveStart
        - effectiveEnd
      properties:
        requestId:
          type: string
        scaledObject:
          $ref: '#/components/schemas/ScaledObject'
        effectiveStart:
          type: string
          format: date-time
        effectiveEnd:
          type: string
          format: date-time
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      additionalProperties: false
